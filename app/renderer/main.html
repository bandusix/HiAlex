<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiAlex - AI Coding Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="main-app">
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>HiAlex</h1>
        <p class="subtitle">AI Coding Assistant</p>
      </div>

      <div class="sidebar-content">
        <button class="btn-new-chat" onclick="mainApp.newChat()">
          <span class="icon">+</span>
          New Chat
        </button>

        <div class="chat-history" id="chat-history">
          <p class="empty-state">No chats yet</p>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="btn-settings" onclick="mainApp.openSettings()">
          ⚙️ Settings
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="chat-container">
        <div class="messages" id="messages">
          <div class="welcome-message">
            <h2>👋 Welcome to HiAlex!</h2>
            <p>Your AI-powered coding assistant is ready.</p>
            <p class="tip">💡 Tip: Ask me to help with code, explain concepts, or review your work.</p>
          </div>
        </div>

        <div class="input-container">
          <form id="chat-form" onsubmit="mainApp.sendMessage(event)">
            <textarea
              id="message-input"
              placeholder="Ask me anything about coding..."
              rows="3"
              autofocus
            ></textarea>
            <button type="submit" class="btn-send" id="btn-send">
              Send
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="main-app.js"></script>
</body>
</html>
