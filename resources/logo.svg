<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="200" cy="200" r="180" fill="url(#gradient)"/>

  <!-- H letter -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="200" font-weight="bold"
        fill="white" text-anchor="middle">H</text>

  <!-- Lightning bolt overlay (suggesting speed/installation) -->
  <path d="M 280 120 L 240 200 L 270 200 L 240 280 L 320 170 L 280 170 Z"
        fill="#FFD700" opacity="0.9"/>
</svg>
